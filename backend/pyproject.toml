# pyproject.toml – MoodTunes AI
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "data/*"]

[tool.coverage.report]
fail_under = 80
